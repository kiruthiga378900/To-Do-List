<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hospital Management System</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Modern Hospital Management and Appointment Scheduling System">
  <meta name="keywords" content="hospital, management, appointments, healthcare, medical">
  <meta name="author" content="Hospital Management Team">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  
  <!-- Material Icons -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  
  <!-- Service Worker for PWA -->
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</head>
<body class="mat-typography">
  <app-root>
    <!-- Loading Screen -->
    <div class="loading-container">
      <div class="loading-spinner">
        <svg class="circular" viewBox="25 25 50 50">
          <circle class="path" cx="50" cy="50" r="20" fill="none" stroke="#1976d2" stroke-width="2" stroke-miterlimit="10"/>
        </svg>
      </div>
      <h3>Loading Hospital Management System...</h3>
    </div>
  </app-root>
  
  <style>
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      margin-bottom: 20px;
    }
    
    .circular {
      animation: rotate 2s linear infinite;
      width: 50px;
      height: 50px;
    }
    
    .path {
      stroke-dasharray: 90, 150;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      animation: dash 1.5s ease-in-out infinite;
    }
    
    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }
    
    @keyframes dash {
      0% {
        stroke-dasharray: 1, 150;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -35;
      }
      100% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -124;
      }
    }
    
    h3 {
      margin: 0;
      color: #333;
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
    }
  </style>
</body>
</html>
