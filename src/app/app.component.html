<mat-toolbar color="primary">
  <span>{{ title }}</span>
  <span class="spacer"></span>
  
  <ng-container *ngIf="currentUser; else loginButton">
    <button mat-button [matMenuTriggerFor]="userMenu">
      <mat-icon>account_circle</mat-icon>
      {{ currentUser.userName || currentUser.email }}
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item routerLink="/profile">
        <mat-icon>person</mat-icon>
        Profile
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        Logout
      </button>
    </mat-menu>
  </ng-container>
  
  <ng-template #loginButton>
    <button mat-button routerLink="/login">
      <mat-icon>login</mat-icon>
      Login
    </button>
  </ng-template>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <mat-toolbar>Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon>
        Dashboard
      </a>
      
      <a mat-list-item routerLink="/appointments" routerLinkActive="active">
        <mat-icon>event</mat-icon>
        Appointments
      </a>
      
      <a mat-list-item routerLink="/doctors" routerLinkActive="active">
        <mat-icon>medical_services</mat-icon>
        Doctors
      </a>
      
      <a mat-list-item routerLink="/patients" routerLinkActive="active">
        <mat-icon>people</mat-icon>
        Patients
      </a>
      
      <a mat-list-item routerLink="/payments" routerLinkActive="active">
        <mat-icon>payment</mat-icon>
        Payments
      </a>
      
      <a mat-list-item routerLink="/admin" routerLinkActive="active" *ngIf="currentUser?.role === 'Admin'">
        <mat-icon>admin_panel_settings</mat-icon>
        Admin
      </a>
    </mat-nav-list>
  </mat-sidenav>
  
  <mat-sidenav-content>
    <div class="container">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
